<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>telc B1 Studio — Personal German Preparation Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    .tab-fade {
      animation: fadeSlide 0.18s ease-out;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <!-- Main Content Container -->
  <main id="app-main" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 pb-28 lg:pb-10"></main>

  <!-- Mobile Bottom Navigation Bar (iPhone Ready) -->
  <nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 safe-bottom shadow-[0_-4px_16px_rgba(15,23,42,0.04)]" id="mobile-nav">
    <div class="grid grid-cols-6 gap-0.5 px-1 pt-1.5">
      <button data-nav="calendar" class="mob-nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-[10px] font-semibold transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Calendar</span>
      </button>
      <button data-nav="tasks" class="mob-nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-[10px] font-semibold transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>

        <span>Practice</span>
      </button>
      <button data-nav="mocks" class="mob-nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-[10px] font-semibold transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Mocks</span>
      </button>
      <button data-nav="progress" class="mob-nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-[10px] font-semibold transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Progress</span>
      </button>
      <button data-nav="grammar" class="mob-nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-[10px] font-semibold transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Grammar</span>
      </button>
    </div>
  </nav>

  <!-- Toast & Modal Overlays (No alert/confirm) -->
  <div id="toast-container" class="fixed bottom-20 lg:bottom-6 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white rounded-2xl border border-slate-200 max-w-lg w-full p-6 shadow-xl"></div>
  </div>

  <script>
    // =========================================================================
    // 1. DATE UTILITIES (19 November 2026 to 20 January 2027 — 63 Days)
    // =========================================================================
    var START_DATE = '2026-11-19';
    var END_DATE = '2027-01-20';

    function parseISO(iso) {
      var p = iso.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }

    function toISO(dateObj) {
      var y = dateObj.getFullYear();
      var m = String(dateObj.getMonth() + 1).padStart(2, '0');
      var d = String(dateObj.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function generateDateRange(startISO, endISO) {
      var list = [];
      var cur = parseISO(startISO);
      var end = parseISO(endISO);
      while (cur <= end) {
        list.push(toISO(cur));
        cur.setDate(cur.getDate() + 1);
      }
      return list;
    }

    var ALL_DATES = generateDateRange(START_DATE, END_DATE);

    var MONTH_NAMES_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var MONTH_NAMES_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function formatShortDate(iso) {
      if (!iso) return '';
      var d = parseISO(iso);
      return d.getDate() + ' ' + MONTH_NAMES_SHORT[d.getMonth()];
    }

    function formatReadableDate(iso) {
      if (!iso) return '';
      var d = parseISO(iso);
      return DAY_NAMES[d.getDay()] + ', ' + d.getDate() + ' ' + MONTH_NAMES_LONG[d.getMonth()] + ' ' + d.getFullYear();
    }

    function getRealCurrentISO() {
      return toISO(new Date());
    }

    var customTodayOverride = null;
    function getLocalTodayISO() {
      if (customTodayOverride && ALL_DATES.indexOf(customTodayOverride) !== -1) {
        return customTodayOverride;
      }
      var real = getRealCurrentISO();
      if (real >= START_DATE && real <= END_DATE) return real;
      return START_DATE;
    }

    // =========================================================================
    // 2. COMPLETE B1 CURRICULUM DATASETS (Initialized BEFORE buildBaseSchedule)
    // =========================================================================
    function makeFiveQuestions(list) {
      var out = [];
      for (var i = 0; i < 5; i++) {
        out.push(list[i % list.length]);
      }
      return out;
    }

    var GRAMMAR_TOPICS = [
      {
        id: 'g1',
        level: 'A2–B1 Core',
        title: 'Nominativ, Akkusativ and Dativ',
        explanation: 'Nominativ marks the subject (who/what performs the action), Akkusativ marks the direct object (who/what is directly affected), and Dativ marks the indirect recipient (to/for whom). Masculine articles change: der → den (Akk) → dem (Dat).',
        wordOrder: 'Subject (Nom) + Conjugated Verb + Indirect Object (Dat) + Direct Object (Akk). If both objects are pronouns, Akkusativ comes before Dativ: Ich gebe es ihm.',
        examples: [
          { de: 'Der Arzt (Nom) gibt dem Patienten (Dat) ein Rezept (Akk).', en: 'The doctor gives the patient a prescription.' },
          { de: 'Ich helfe meinem Bruder bei den Hausaufgaben.', en: 'I help my brother with his homework.' },
          { de: 'Kannst du mir bitte den Schlüssel geben?', en: 'Can you please give me the key?' }
        ],
        mistakes: [
          'Using Akkusativ after Dativ-only verbs (helfen, danken, gehören, gefallen, schmecken, passen).',
          'Forgetting the extra -n on plural nouns in Dativ (mit den Kindern, aus den Häusern).'
        ],
        exercises: makeFiveQuestions([
          { q: 'Ich danke ___ herzlich für deine Einladung.', options: ['dich', 'dir', 'du'], ans: 1, exp: '"danken" always takes Dativ → dir.' },
          { q: 'Der Kellner bringt ___ Gast die Rechnung.', options: ['der', 'den', 'dem'], ans: 2, exp: 'Indirect recipient masculine in Dativ → dem Gast.' },
          { q: 'Hast du ___ neuen Kurs schon gebucht?', options: ['der', 'den', 'dem'], ans: 1, exp: 'Direct object masculine in Akkusativ → den neuen Kurs.' },
          { q: 'Die Tasche gehört ___ Kollegin.', options: ['die', 'der', 'den'], ans: 1, exp: '"gehören" takes Dativ feminine → der Kollegin.' },
          { q: 'Wir fahren mit ___ Kindern ans Meer.', options: ['die', 'der', 'den'], ans: 2, exp: 'Preposition "mit" + Dativ plural → den Kindern.' }
        ])
      },
      {
        id: 'g2',
        level: 'A2–B1 Core',
        title: 'Definite and Indefinite Articles',
        explanation: 'Definite articles (der, die, das) refer to specific, known nouns. Indefinite articles (ein, eine, ein) introduce unspecific singular nouns. There is no plural indefinite article.',
        wordOrder: 'Articles stand directly before the noun or before adjectives modifying the noun: ein sehr interessantes Buch.',
        examples: [
          { de: 'Ein Mann betritt das Büro. Der Mann sucht einen Termin.', en: 'A man enters the office. The man is looking for an appointment.' },
          { de: 'Sie wohnt in einer ruhigen Straße.', en: 'She lives on a quiet street.' },
          { de: 'Auf dem Tisch liegt ein Formular.', en: 'A form is lying on the table.' }
        ],
        mistakes: [
          'Using "ein" in plural instead of zero article or "viele/einige".',
          'Mixing up neuter "das/ein" with masculine "der/ein" in Akkusativ (einen vs. ein).'
        ],
        exercises: makeFiveQuestions([
          { q: 'Er fährt jeden Tag mit ___ Zug zur Arbeit.', options: ['der', 'den', 'dem'], ans: 2, exp: '"mit" requires Dativ masculine → dem Zug.' },
          { q: 'Ich brauche ___ neuen Drucker für das Büro.', options: ['ein', 'einen', 'einem'], ans: 1, exp: 'Masculine Akkusativ indefinite → einen.' },
          { q: 'In der Stadt gibt es ___ alte Bibliothek.', options: ['ein', 'eine', 'einer'], ans: 1, exp: '"es gibt" + Akkusativ feminine → eine.' },
          { q: 'Wir sprechen mit ___ Lehrerin über die Prüfung.', options: ['eine', 'einer', 'einen'], ans: 1, exp: '"mit" + Dativ feminine → einer Lehrerin.' },
          { q: '___ Ergebnis der Prüfung wird morgen veröffentlicht.', options: ['Der', 'Die', 'Das'], ans: 2, exp: 'Nouns ending in -nis are mostly neuter → Das Ergebnis.' }
        ])
      },
      {
        id: 'g3',
        level: 'A2–B1 Core',
        title: 'Kein and Possessive Articles',
        explanation: '"kein-" negates nouns that have no article or an indefinite article. Possessive articles (mein, dein, sein, ihr, unser, euer, ihr, Ihr) show ownership and take the exact same endings as "ein-" (and "die" in plural).',
        wordOrder: 'Placed directly before the noun phrase: Wir haben leider keine Zeit.',
        examples: [
          { de: 'Ich habe heute keinen Unterricht.', en: 'I have no classes today.' },
          { de: 'Sie besucht am Wochenende ihre Eltern.', en: 'She is visiting her parents on the weekend.' },
          { de: 'Habt ihr euren Ausweis dabei?', en: 'Do you (pl.) have your ID with you?' }
        ],
        mistakes: [
          'Using "nicht" instead of "kein" before nouns without an article (Wrong: Ich habe nicht Zeit → Right: Ich habe keine Zeit).',
          'Keeping the internal "e" in "euer" when adding an ending (Wrong: euere → Right: eure).'
        ],
        exercises: makeFiveQuestions([
          { q: 'Leider habe ich heute ___ Zeit für ein Treffen.', options: ['nicht', 'kein', 'keine'], ans: 2, exp: 'Feminine Akkusativ "die Zeit" → keine Zeit.' },
          { q: 'Paul fährt mit ___ Fahrrad zur Universität.', options: ['seinem', 'seinen', 'seiner'], ans: 0, exp: '"mit" + Dativ neuter ("das Fahrrad") → seinem.' },
          { q: 'Habt ihr ___ Unterlagen schon abgegeben?', options: ['euer', 'eure', 'euren'], ans: 1, exp: 'Plural Akkusativ → eure Unterlagen.' },
          { q: 'In dieser Wohnung gibt es ___ Balkon.', options: ['kein', 'keinen', 'keinem'], ans: 1, exp: '"es gibt" + Akkusativ masculine ("der Balkon") → keinen.' },
          { q: 'Frau Weber, ist das ___ Tasche?', options: ['ihre', 'Ihre', 'Ihr'], ans: 1, exp: 'Formal "Sie" possessive feminine Nominativ → Ihre.' }
        ])
      },
      {
        id: 'g4',
        level: 'B1 Core',
        title: 'Gender and Plural Forms',
        explanation: 'Suffixes give reliable gender clues: -ung, -heit, -keit, -schaft, -tion, -tät → die (feminine); -chen, -lein, -ment, -um → das (neuter); -er, -ling, -ismus → der (masculine). Always memorize the plural form with each noun.',
        wordOrder: 'Plural definite article is always "die" (Nom/Akk), "den" + -n (Dat), and "der" (Gen).',
        examples: [
          { de: 'Die Entscheidung (fem.) → die Entscheidungen.', en: 'The decision → the decisions.' },
          { de: 'Das Praktikum (neut.) → die Praktika.', en: 'The internship → the internships.' },
          { de: 'Der Vorschlag (masc.) → die Vorschläge.', en: 'The suggestion → the suggestions.' }
        ],
        mistakes: [
          'Assuming all nouns ending in -e are feminine (exceptions: der Name, der Kollege, der Kunde, das Ende).',
          'Forgetting the Dativ plural -n ending when plural does not end in -n or -s.'
        ],
        exercises: makeFiveQuestions([
          { q: 'Welcher Artikel ist richtig? ___ Erfahrung ist im Beruf sehr hilfreich.', options: ['Der', 'Die', 'Das'], ans: 1, exp: 'All nouns ending in -ung are feminine → Die Erfahrung.' },
          { q: 'Wie lautet der Plural von "die Wohnung"?', options: ['die Wohnunge', 'die Wohnungen', 'die Wohnungs'], ans: 1, exp: 'Feminine nouns ending in -ung add -en in plural.' },
          { q: 'Welcher Artikel passt? ___ Dokument muss unterschrieben werden.', options: ['Der', 'Die', 'Das'], ans: 2, exp: 'Nouns ending in -ment are neuter → Das Dokument.' },
          { q: 'Wir sprechen mit unseren neuen ___ (der Kunde, Plural).', options: ['Kunde', 'Kunden', 'Kundes'], ans: 1, exp: 'N-declension masculine noun: plural is die Kunden.' },
          { q: 'Wie lautet der Plural von "das Thema"?', options: ['die Themen', 'die Themas', 'die Theme'], ans: 0, exp: 'Neuter nouns ending in -ma form plural with -men → die Themen.' }
        ])
      },
      {
        id: 'g5',
        level: 'B1 Core',
        title: 'Genitiv (B1 Essential Prepositions & Possession)',
        explanation: 'Genitiv expresses possession and follows key B1 prepositions: wegen (because of), trotz (despite), während (during), statt/anstatt (instead of). Masculine and neuter articles become "des/eines" and nouns add -(e)s.',
        wordOrder: 'Genitiv attribute follows the noun: das Büro meines Chefs. Genitiv prepositional phrases often open the sentence: Wegen des Regens…',
        examples: [
          { de: 'Wegen des starken Verkehrs kam ich zu spät.', en: 'Because of the heavy traffic, I arrived late.' },
          { de: 'Trotz der Krankheit hat sie die Prüfung bestanden.', en: 'Despite the illness, she passed the exam.' },
          { de: 'Während des Semesters arbeite ich Teilzeit.', en: 'During the semester, I work part-time.' }
        ],
        mistakes: [
          'Forgetting the -(e)s suffix on masculine and neuter nouns in Genitiv (des Tages, des Urlaubs).',
          'Using Dativ instead of Genitiv in formal B1 writing/Sprachbausteine.'
        ],
        exercises: makeFiveQuestions([
          { q: '___ des schlechten Wetters machen wir einen Ausflug.', options: ['Trotz', 'Wegen', 'Ohne'], ans: 0, exp: '"Trotz" means "despite" and takes Genitiv.' },
          { q: 'Während ___ Studiums wohnte er in einem Wohnheim.', options: ['sein', 'seines', 'seinem'], ans: 1, exp: 'Neuter Genitiv ("das Studium") → seines Studiums.' },
          { q: 'Wegen ___ Verspätung verpasste ich den Anschlusszug.', options: ['der', 'die', 'dem'], ans: 0, exp: 'Feminine Genitiv ("die Verspätung") → der Verspätung.' },
          { q: 'Das ist das Auto ___ neuen Nachbarn.', options: ['unser', 'unseres', 'unserem'], ans: 1, exp: 'Masculine Genitiv ("der Nachbar") → unseres.' },
          { q: '___ eines Briefes schicke ich lieber eine E-Mail.', options: ['Anstatt', 'Für', 'Durch'], ans: 0, exp: '"Anstatt" + Genitiv means "instead of".' }
        ])
      },
      {
        id: 'g6',
        level: 'A2–B1 Core',
        title: 'Wechselpräpositionen (Two-Way Prepositions)',
        explanation: 'an, auf, hinter, in, neben, über, unter, vor, zwischen take Akkusativ for movement/direction (Wohin?) and Dativ for static location/position (Wo?).',
        wordOrder: 'Action verbs (stellen, legen, setzen, hängen) → Akkusativ. Position verbs (stehen, liegen, sitzen, hängen) → Dativ.',
        examples: [
          { de: 'Ich lege das Buch auf den Tisch. (Wohin? → Akkusativ)', en: 'I put the book onto the table.' },
          { de: 'Das Buch liegt auf dem Tisch. (Wo? → Dativ)', en: 'The book is lying on the table.' },
          { de: 'Wir gehen ins Kino. / Wir sind im Kino.', en: 'We are going to the cinema. / We are in the cinema.' }

    function generateTutorCode() {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var part1 = '';
      var part2 = '';
      for (var i = 0; i < 4; i++) {
        part1 += chars.charAt(Math.floor(Math.random() * chars.length));
        part2 += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return 'B1-' + part1 + '-' + part2;
    }

    function sanitizeTutorCode(raw) {
      return String(raw || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 24);
    }

    function getOrCreateTutorCode() {
      var store = getBrowserStorage();
      var code = store ? store.getItem(TUTOR_CODE_KEY) : '';
      if (!code) {
        code = generateTutorCode();
        if (store) {
          try { store.setItem(TUTOR_CODE_KEY, code); } catch (e) {}
        }
      }
      uiState.tutorShareCode = code;
      return code;
    }

    function buildTutorSummaryPayload() {
      var perf = computeSectionPerformance();
      var completedDaysCount = 0;
      var studyDaysTotal = 0;
      var totalMinutesStudied = 0;

      ALL_DATES.forEach(function(iso) {
        var day = getDaySchedule(iso);
        totalMinutesStudied += day.actualLoggedMins;
        if (day.dayType !== 'uni-exam') {
          studyDaysTotal += 1;
          if (day.completionPct === 100) completedDaysCount += 1;
        }
      });

      var recentNotes = [];
      ALL_DATES.slice().reverse().forEach(function(iso) {
        if (appState.taskNotes[iso] && appState.taskNotes[iso].trim() && recentNotes.length < 8) {
          recentNotes.push({ date: iso, note: appState.taskNotes[iso].trim() });
        }
      });

      return {
        updatedAt: new Date().toISOString(),
        shareCode: uiState.tutorShareCode,
        stats: {
          completedDays: completedDaysCount,
          totalStudyDays: studyDaysTotal,
          totalMinutes: totalMinutesStudied,
          vocabLearned: Object.keys(appState.vocabStatus).filter(function(k) {
            return appState.vocabStatus[k] === 'learned' || appState.vocabStatus[k] === 'remembered';
          }).length,
          grammarDone: Object.keys(appState.completedGrammar).filter(function(k) { return !!appState.completedGrammar[k]; }).length,
          connectorsDone: Object.keys(appState.completedConnectors).filter(function(k) { return !!appState.completedConnectors[k]; }).length
        },
        sectionPerformance: perf,
        mockExams: appState.mockExams || [],
        recentNotes: recentNotes,
        rawState: appState
      };

    function pushStateToTutorCloud() {
      if (uiState.tutorReadOnlyMode || !cloudDb || !cloudFs || !cloudUser || !uiState.tutorShareCode) return;
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(function() {
        try {
          if (!cloudUser) return;
          var appId = window['__app_id'] || 'default-app-id';
          var docRef = cloudFs.doc(cloudDb, 'artifacts', appId, 'public', 'data', 'tutor_progress', uiState.tutorShareCode);
          cloudFs.setDoc(docRef, buildTutorSummaryPayload(), { merge: true }).then(function() {
            uiState.tutorCloudStatus = 'synced';
            updateSyncBadge('Tutor Live', 'bg-emerald-500');
          }).catch(function() {
            uiState.tutorCloudStatus = 'local';
          });
        } catch (e) {}
      }, 400);

    function subscribeAsTutor(code) {
      var cleanCode = sanitizeTutorCode(code);
      if (!cleanCode) return;
      uiState.tutorShareCode = cleanCode;
      uiState.tutorReadOnlyMode = true;

      if (cloudUnsubscribe) {
        try { cloudUnsubscribe(); } catch (e) {}
        cloudUnsubscribe = null;
      }

      if (!cloudDb || !cloudFs || !cloudUser) {
        showToast('Connecting to live tutor channel…');
        renderApp();
        return;
      }

      var appId = window['__app_id'] || 'default-app-id';
      var docRef = cloudFs.doc(cloudDb, 'artifacts', appId, 'public', 'data', 'tutor_progress', cleanCode);
      updateSyncBadge('Tutor Live View', 'bg-sky-500');

      cloudUnsubscribe = cloudFs.onSnapshot(
        docRef,
        function(snap) {
          if (snap.exists()) {
            var data = snap.data();
            if (data && data.rawState) {
              appState = Object.assign(
                {},
                JSON.parse(JSON.stringify(defaultState)),
                data.rawState,
                {
                  readingLogs: Object.assign(
                    {},
                    defaultState.readingLogs,
                    data.rawState.readingLogs || {}
                  )
                }
              );
              uiState.tutorCloudStatus = 'connected';
              showToast('Synced live progress for code ' + cleanCode);
              renderApp();
            }
          } else {
            uiState.tutorCloudStatus = 'not_found';
            showToast('No student data found yet for code ' + cleanCode);
            renderApp();
          }
        },
        function() {
          uiState.tutorCloudStatus = 'error';
          showToast('Could not read tutor stream right now.');
        }
      );
    }

    function initCloudSync() {
      getOrCreateTutorCode();
      var rawConfig = window['__firebase_config'];
      if (!rawConfig) return;

      Promise.all([
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
      ]).then(function(mods) {
        var appMod = mods[0];
        var authMod = mods[1];
        var fsMod = mods[2];
        var cfg = typeof rawConfig === 'string' ? JSON.parse(rawConfig) : rawConfig;
        var app = appMod.initializeApp(cfg);
        var auth = authMod.getAuth(app);
        cloudDb = fsMod.getFirestore(app);
        cloudFs = fsMod;

        var token = window['__initial_auth_token'];
        var authPromise = token
          ? authMod.signInWithCustomToken(auth, token)
          : authMod.signInAnonymously(auth);

        return authPromise.then(function() {
          cloudUser = auth.currentUser;
          if (!cloudUser) return;
          uiState.tutorCloudStatus = 'synced';
          if (uiState.tutorReadOnlyMode && uiState.tutorShareCode) {
            subscribeAsTutor(uiState.tutorShareCode);
          } else {
            pushStateToTutorCloud();
          }
        });
      }).catch(function() {
        uiState.tutorCloudStatus = 'local';
      });
    }

    function computeSectionPerformance() {
      var sections = {
        lesen1: { label: 'Lesen Teil 1 (Global)', correct: 0, total: 0 },
        lesen2: { label: 'Lesen Teil 2 (Detail)', correct: 0, total: 0 },
        lesen3: { label: 'Lesen Teil 3 (Selektiv)', correct: 0, total: 0 },
        sb1: { label: 'Sprachbausteine T1 (Grammar)', correct: 0, total: 0 },
        sb2: { label: 'Sprachbausteine T2 (Vocab)', correct: 0, total: 0 },
        hoeren: { label: 'Hören (Listening)', correct: 0, total: 0 },
        schreiben: { label: 'Schreiben (Writing)', correct: 0, total: 0 },
        sprechen: { label: 'Sprechen (Speaking)', correct: 0, total: 0 }
      };

      ['lesen1', 'lesen2', 'lesen3', 'sb1', 'sb2'].forEach(function(key) {
        var logs = appState.readingLogs[key] || [];
        logs.forEach(function(l) {
          sections[key].correct += Number(l.correct || 0);
          sections[key].total += Number(l.total || 0);
        });
      });

      (appState.mockExams || []).forEach(function(m) {
        ['lesen1', 'lesen2', 'lesen3', 'sb1', 'sb2'].forEach(function(key) {
          if (m[key] && m[key].total > 0) {
            sections[key].correct += Number(m[key].correct || 0);
            sections[key].total += Number(m[key].total || 0);
          }
        });
        if (m.hoeren && m.hoeren.max > 0) {
          sections.hoeren.correct += Number(m.hoeren.score || 0);
          sections.hoeren.total += Number(m.hoeren.max || 0);
        }
        if (m.schreiben && m.schreiben.max > 0) {
          sections.schreiben.correct += Number(m.schreiben.score || 0);
          sections.schreiben.total += Number(m.schreiben.max || 0);
        }
        if (m.sprechen && m.sprechen.max > 0) {
          sections.sprechen.correct += Number(m.sprechen.score || 0);
          sections.sprechen.total += Number(m.sprechen.max || 0);
        }
      });

      Object.keys(sections).forEach(function(k) {
        var s = sections[k];
        s.pct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : null;
      });

      return sections;
    }

    function getAdaptivePlanAnalysis() {
      var perf = computeSectionPerformance();
      var weakList = [];
      Object.keys(perf).forEach(function(k) {
        if (perf[k].pct !== null && perf[k].pct < 70) {
          weakList.push({ key: k, label: perf[k].label, pct: perf[k].pct });
        }
      });
      weakList.sort(function(a, b) { return a.pct - b.pct; });

      if (weakList.length === 0) {
        return {
          active: false,
          weakSections: [],
          boostTask: null,
          explanation: ''
        };
      }

      var weakest = weakList[0];
      var boostMap = {
        lesen1: { category: 'lesen', title: 'Adaptive Boost: Extra Lesen Teil 1 (Globalverstehen)', desc: 'Added automatically because Lesen Teil 1 accuracy is ' + weakest.pct + '%. Complete 5 headline-matching items.', duration: 15, link: { view: 'practice', sub: 'reading', id: 'lesen1' } },
        lesen2: { category: 'lesen', title: 'Adaptive Boost: Extra Lesen Teil 2 (Detailverstehen)', desc: 'Added automatically because Lesen Teil 2 accuracy is ' + weakest.pct + '%. Practice 1 detailed article + synonym check.', duration: 15, link: { view: 'practice', sub: 'reading', id: 'lesen2' } },
        lesen3: { category: 'lesen', title: 'Adaptive Boost: Extra Lesen Teil 3 (Selektives Verstehen)', desc: 'Added automatically because Lesen Teil 3 accuracy is ' + weakest.pct + '%. Solve 5 ad-matching situations.', duration: 15, link: { view: 'practice', sub: 'reading', id: 'lesen3' } },
        sb1: { category: 'grammar', title: 'Adaptive Boost: Extra Sprachbausteine T1 Grammar Drill', desc: 'Added automatically because Sprachbausteine T1 accuracy is ' + weakest.pct + '%. Complete 10 grammar cloze gaps.', duration: 15, link: { view: 'practice', sub: 'reading', id: 'sb1' } },
        sb2: { category: 'vocabulary', title: 'Adaptive Boost: Extra Sprachbausteine T2 Word-Choice', desc: 'Added automatically because Sprachbausteine T2 accuracy is ' + weakest.pct + '%. Practice B1 collocations & lexical gaps.', duration: 15, link: { view: 'practice', sub: 'reading', id: 'sb2' } },
        hoeren: { category: 'hoeren', title: 'Adaptive Boost: Extra Hören Listening Comprehension', desc: 'Added automatically because Hören accuracy is ' + weakest.pct + '%. Listen to 2 B1 audio dialogues & log keywords.', duration: 15, link: { view: 'practice', sub: 'hoeren' } },
        schreiben: { category: 'schreiben', title: 'Adaptive Boost: Extra Schreiben Email & Error Correction', desc: 'Added automatically because Schreiben score is ' + weakest.pct + '%. Write a 100-word reply & verify verb positions.', duration: 15, link: { view: 'practice', sub: 'schreiben', id: 'sch2' } },
        sprechen: { category: 'sprechen', title: 'Adaptive Boost: Extra Sprechen 7-Step Oral Practice', desc: 'Added automatically because Sprechen score is ' + weakest.pct + '%. Run a 6-minute timed partner discussion.', duration: 15, link: { view: 'practice', sub: 'sprechen', id: 'sp2' } }
      };

      var weakNames = weakList.map(function(w) { return w.label + ' (' + w.pct + '%)'; }).join(', ');
      return {
        active: true,
        weakSections: weakList,
        boostTask: boostMap[weakest.key],
        explanation: 'Your schedule has automatically added a 15-minute targeted booster on upcoming study days because your recorded results show lower accuracy in: ' + weakNames + '. All other exam sections remain balanced through 20 January 2027.'
      };
    }

    function getDaySchedule(iso) {
      var base = BASE_SCHEDULE[iso];
      if (!base) return null;

      var tasks = base.tasks.map(function(t) { return Object.assign({}, t); });
      var todayISO = getLocalTodayISO();
      var adaptive = getAdaptivePlanAnalysis();
      var hasAdaptiveBoost = false;

      if (adaptive.active && adaptive.boostTask && iso >= todayISO && base.dayType !== 'uni-exam') {
        hasAdaptiveBoost = true;
        tasks.push(Object.assign({}, adaptive.boostTask, {
          id: iso + '_adaptive',
          isAdaptive: true
        }));
      }

      var extra = (appState.rescheduledTasks && appState.rescheduledTasks[iso]) || [];
      extra.forEach(function(rt) {
        tasks.push(Object.assign({}, rt));
      });

      var compulsoryTasks = tasks.filter(function(t) { return !t.optional; });
      var totalPlannedMins = tasks.reduce(function(sum, t) { return sum + Number(t.duration || 0); }, 0);
      var actualLoggedMins = tasks.reduce(function(sum, t) {
        return sum + Number(appState.actualMinutes[t.id] || 0);
      }, 0);

      var completedCompulsory = compulsoryTasks.filter(function(t) { return !!appState.completedTasks[t.id]; }).length;
      var completedAll = tasks.filter(function(t) { return !!appState.completedTasks[t.id]; }).length;

      var completionPct = 0;
      if (compulsoryTasks.length > 0) {
        completionPct = Math.round((completedCompulsory / compulsoryTasks.length) * 100);
      } else if (tasks.length > 0 && completedAll > 0) {
        completionPct = 100;
      }

      return Object.assign({}, base, {
        tasks: tasks,
        compulsoryCount: compulsoryTasks.length,
        completedCount: completedAll,
        totalPlannedMins: totalPlannedMins,
        actualLoggedMins: actualLoggedMins,
        completionPct: completionPct,
        hasAdaptiveBoost: hasAdaptiveBoost
      });
    }

    var timerInterval = null;

    function formatMMSS(totalSec) {
      var s = Math.max(0, Math.floor(totalSec));
      var mins = String(Math.floor(s / 60)).padStart(2, '0');
      var secs = String(s % 60).padStart(2, '0');
      return mins + ':' + secs;
    }

    function updateTimerBarUI() {
      var bar = document.getElementById('active-timer-bar');
      if (!bar) return;
      if (!uiState.timer.activeTaskId) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      document.getElementById('timer-date-label').textContent = 'Studying • ' + formatShortDate(uiState.timer.activeDate);
      document.getElementById('timer-task-title').textContent = uiState.timer.title;
      document.getElementById('timer-display').textContent = formatMMSS(uiState.timer.elapsedSec) + ' / ' + formatMMSS(uiState.timer.plannedSec);
      document.getElementById('timer-toggle-btn').textContent = uiState.timer.running ? 'Pause' : 'Resume';
      var pulse = document.getElementById('timer-pulse');
      if (pulse) {
        pulse.className = uiState.timer.running
          ? 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shrink-0'
          : 'w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0';
      }
    }

    function ensureGlobalInterval() {
      if (timerInterval) return;
      timerInterval = setInterval(function() {
        var needsUI = false;
        if (uiState.timer.activeTaskId && uiState.timer.running) {
          uiState.timer.elapsedSec += 1;
          if (uiState.timer.elapsedSec % 60 === 0) {
            var tid = uiState.timer.activeTaskId;
            appState.actualMinutes[tid] = (appState.actualMinutes[tid] || 0) + 1;
            saveState();
          }
          updateTimerBarUI();
        }
        if (uiState.speakingTimerRunning && uiState.speakingTimerSec > 0) {
          uiState.speakingTimerSec -= 1;
          var spEl = document.getElementById('speaking-timer-display');
          if (spEl) spEl.textContent = formatMMSS(uiState.speakingTimerSec);
          if (uiState.speakingTimerSec === 0) {
            uiState.speakingTimerRunning = false;
            showToast('Speaking time finished!');
            needsUI = true;
          }
        }
        if (needsUI) renderApp();
      }, 1000);
    }

    function startTaskTimer(dateISO, taskId) {
      var day = getDaySchedule(dateISO);
      if (!day) return;
      var task = day.tasks.find(function(t) { return t.id === taskId; });
      if (!task) return;

      if (uiState.timer.activeTaskId === taskId) {
        uiState.timer.running = !uiState.timer.running;
      } else {
        uiState.timer = {
          activeTaskId: taskId,
          activeDate: dateISO,
          title: task.title,
          plannedSec: (task.duration || 15) * 60,
          elapsedSec: (appState.actualMinutes[taskId] || 0) * 60,
          running: true
        };
      }
      ensureGlobalInterval();
      updateTimerBarUI();
      renderApp();
    }

    document.getElementById('timer-toggle-btn').addEventListener('click', function() {
      if (!uiState.timer.activeTaskId) return;
      uiState.timer.running = !uiState.timer.running;
      updateTimerBarUI();
      renderApp();
    });

    document.getElementById('timer-complete-btn').addEventListener('click', function() {
      var tid = uiState.timer.activeTaskId;
      if (!tid) return;
      var mins = Math.max(1, Math.round(uiState.timer.elapsedSec / 60));
      appState.actualMinutes[tid] = Math.max(appState.actualMinutes[tid] || 0, mins);
      appState.completedTasks[tid] = true;
      uiState.timer = { activeTaskId: null, activeDate: null, title: '', plannedSec: 0, elapsedSec: 0, running: false };
      updateTimerBarUI();
      showToast('Task completed & ' + mins + ' min logged!');
      saveState();
    });

    document.getElementById('timer-stop-btn').addEventListener('click', function() {
      var tid = uiState.timer.activeTaskId;
      if (tid) {
        var mins = Math.floor(uiState.timer.elapsedSec / 60);
        if (mins > 0) {
          appState.actualMinutes[tid] = Math.max(appState.actualMinutes[tid] || 0, mins);
        }
      }
      uiState.timer = { activeTaskId: null, activeDate: null, title: '', plannedSec: 0, elapsedSec: 0, running: false };
      updateTimerBarUI();
      saveState();
    });

    function showToast(msg) {
      var container = document.getElementById('toast-container');
      if (!container) return;
      var el = document.createElement('div');
      el.className = 'bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg border border-slate-700 pointer-events-auto transition-opacity duration-300';
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(function() {
        el.style.opacity = '0';
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
      }, 2600);
    }

    function speakGerman(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'de-DE';
          u.rate = 0.94;
          window.speechSynthesis.speak(u);
          showToast('Playing German pronunciation…');
        } else {
          showToast('German audio not supported on this browser.');
        }
      } catch (e) {
        showToast('Audio playback unavailable.');
      }
    }

    // 10A. Five Independent Reading & Sprachbausteine Sections
    function renderReadingPracticeSubView() {
      var activeSec = READING_SECTIONS.find(function(s) { return s.id === uiState.selectedReadingId; }) || READING_SECTIONS[0];
      var logs = appState.readingLogs[activeSec.id] || [];
      var totalQ = logs.reduce(function(s, l) { return s + Number(l.total); }, 0);
      var totalCorrect = logs.reduce(function(s, l) { return s + Number(l.correct); }, 0);
      var accuracyPct = totalQ > 0 ? Math.round((totalCorrect / totalQ) * 100) : 0;
      var avgScorePct = logs.length > 0
        ? Math.round(logs.reduce(function(s, l) { return s + (l.total > 0 ? (l.correct / l.total) * 100 : 0); }, 0) / logs.length)
        : 0;

      var graphHTML = '<p class="text-xs text-slate-400 italic py-6 text-center">Complete a practice set or log a score below to see your improvement graph for ' + activeSec.shortName + '.</p>';
      if (logs.length > 0) {
        var recent = logs.slice(-10);
        var points = recent.map(function(l, idx) {
          var pct = l.total > 0 ? Math.round((l.correct / l.total) * 100) : 0;
          var x = recent.length === 1 ? 150 : 25 + (idx / (recent.length - 1)) * 250;
          var y = 95 - (pct / 100) * 75;
          return { x: x, y: y, pct: pct };
        });
        var polyline = points.map(function(p) { return p.x + ',' + p.y; }).join(' ');
        var dotsHTML = points.map(function(p) {
          return '<circle cx="' + p.x + '" cy="' + p.y + '" r="4.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.5" />' +
                 '<text x="' + p.x + '" y="' + (p.y - 8) + '" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">' + p.pct + '%</text>';
        }).join('');
        graphHTML =
          '<svg viewBox="0 0 300 115" class="w-full h-36 overflow-visible">' +
            '<line x1="20" y1="20" x2="280" y2="20" stroke="#E2E8F0" stroke-dasharray="3 3" />' +
            '<line x1="20" y1="57" x2="280" y2="57" stroke="#E2E8F0" stroke-dasharray="3 3" />' +
            '<line x1="20" y1="95" x2="280" y2="95" stroke="#CBD5E1" />' +
            '<text x="2" y="23" font-size="8" fill="#94A3B8">100%</text>' +
            '<text x="6" y="60" font-size="8" fill="#94A3B8">50%</text>' +
            '<text x="10" y="98" font-size="8" fill="#94A3B8">0%</text>' +
            (points.length > 1 ? '<polyline fill="none" stroke="#4F46E5" stroke-width="2.5" points="' + polyline + '" />' : '') +
            dotsHTML +
          '</svg>';
      }

      var weaknessAnalysis = 'No attempts logged yet. Start with the interactive set below or log book practice.';
      if (totalQ > 0) {
        if (accuracyPct < 60) {
          weaknessAnalysis = 'Priority Focus Needed (' + accuracyPct + '%): Underline keywords in the questions first before scanning the text. Review every wrong answer in your notes.';
        } else if (accuracyPct < 75) {
          weaknessAnalysis = 'Developing Solidly (' + accuracyPct + '%): You grasp the main ideas well; focus on subtle distractors and synonyms to push past 80%.';
        } else {
          weaknessAnalysis = 'Strong Section (' + accuracyPct + '%): Ready for telc B1 exam conditions! Keep maintaining speed and accuracy.';
        }
      }

      var pillsHTML = READING_SECTIONS.map(function(sec) {
        var sLogs = appState.readingLogs[sec.id] || [];
        var sQ = sLogs.reduce(function(a, b) { return a + Number(b.total); }, 0);
        var sC = sLogs.reduce(function(a, b) { return a + Number(b.correct); }, 0);
        var sPct = sQ > 0 ? Math.round((sC / sQ) * 100) + '%' : 'No data';
        var active = sec.id === activeSec.id;
        var subtitlePart = sec.name.split('–')[1] ? sec.name.split('–')[1].trim() : '';
        return (
          '<button data-select-reading="' + sec.id + '" class="text-left p-3 rounded-xl border transition ' + (active ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' : 'bg-white text-slate-800 border-slate-200 hover:border-indigo-300') + '">' +
            '<div class="text-xs font-extrabold truncate">' + sec.shortName + '</div>' +
            '<div class="text-[11px] mt-0.5 ' + (active ? 'text-indigo-100' : 'text-slate-500') + ' truncate">' + subtitlePart + '</div>' +
            '<div class="text-xs font-bold mt-2 ' + (active ? 'text-white' : 'text-indigo-600') + '">' + sPct + ' <span class="font-normal opacity-80">(' + sC + '/' + sQ + ')</span></div>' +
          '</button>'
        );
      }).join('');

      var historyHTML = logs.length === 0
        ? '<p class="text-xs text-slate-400">No entries recorded yet.</p>'
        : logs.slice().reverse().map(function(l) {
            var p = l.total > 0 ? Math.round((l.correct / l.total) * 100) : 0;
            return (
              '<div class="flex items-center justify-between text-xs p-2 rounded-lg bg-slate-50 border border-slate-100">' +
                '<div><span class="font-bold text-slate-800">' + l.correct + '/' + l.total + ' (' + p + '%)</span> <span class="text-slate-400 ml-1">' + (l.note || 'Practice') + '</span></div>' +
                '<span class="text-[11px] text-slate-400">' + formatShortDate(l.date) + '</span>' +
              '</div>'
            );
          }).join('');

      var activeSet = activeSec.practiceSets[0];
      var passageBlock = activeSet.passage
        ? '<div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-800 leading-relaxed whitespace-pre-line">' + activeSet.passage + '</div>'
        : '';

      var questionsHTML = activeSet.questions.map(function(qItem, qIdx) {
        var qKey = 'read_' + activeSec.id + '_' + qIdx;
        var chosen = uiState.quizSelections[qKey];
        var isAnswered = chosen !== undefined;
        var optsHTML = qItem.options.map(function(opt, oIdx) {
          var btnClass = 'bg-white border-slate-200 text-slate-700 hover:border-indigo-400';
          if (isAnswered) {
            if (oIdx === qItem.ans) btnClass = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
            else if (oIdx === chosen) btnClass = 'bg-rose-50 border-rose-400 text-rose-900';
          }
          return '<button data-quiz-pick="' + qKey + '|' + oIdx + '" class="text-left p-2.5 rounded-xl border text-xs transition ' + btnClass + '">' + opt + '</button>';
        }).join('');

        var expBlock = isAnswered
          ? '<div class="text-xs p-2.5 rounded-lg ' + (chosen === qItem.ans ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-900') + '"><strong>' + (chosen === qItem.ans ? '✓ Richtig!' : '✗ Erklärung:') + '</strong> ' + qItem.exp + '</div>'
          : '';

        return (
          '<div class="p-4 rounded-xl border border-slate-200 bg-slate-50/40 space-y-2.5">' +
            '<p class="text-xs sm:text-sm font-semibold text-slate-900 whitespace-pre-line">' + qItem.text + '</p>' +
            '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">' + optsHTML + '</div>' +
            expBlock +
          '</div>'
        );
      }).join('');

      return (
        '<div class="space-y-5">' +
          '<div class="grid grid-cols-1 sm:grid-cols-5 gap-2">' + pillsHTML + '</div>' +
          '<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">' +
            '<div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4">' +
              '<div>' +
                '<h3 class="text-lg font-extrabold text-slate-900">' + activeSec.name + '</h3>' +
                '<p class="text-xs sm:text-sm text-slate-600 mt-1">' + activeSec.desc + '</p>' +
              '</div>' +
              '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">' +
                '<div class="p-3 rounded-xl bg-slate-50 border border-slate-100"><div class="text-[11px] font-semibold text-slate-400 uppercase">Attempted</div><div class="text-lg font-extrabold text-slate-900 mt-0.5">' + totalQ + ' Qs</div></div>' +
                '<div class="p-3 rounded-xl bg-slate-50 border border-slate-100"><div class="text-[11px] font-semibold text-slate-400 uppercase">Correct</div><div class="text-lg font-extrabold text-emerald-600 mt-0.5">' + totalCorrect + ' Qs</div></div>' +
                '<div class="p-3 rounded-xl bg-slate-50 border border-slate-100"><div class="text-[11px] font-semibold text-slate-400 uppercase">Accuracy</div><div class="text-lg font-extrabold text-indigo-600 mt-0.5">' + accuracyPct + '%</div></div>' +
                '<div class="p-3 rounded-xl bg-slate-50 border border-slate-100"><div class="text-[11px] font-semibold text-slate-400 uppercase">Avg Score</div><div class="text-lg font-extrabold text-slate-900 mt-0.5">' + avgScorePct + '%</div></div>' +
              '</div>' +
              '<div class="p-3.5 rounded-xl bg-slate-50/70 border border-slate-200/70">' +
                '<div class="text-xs font-bold text-slate-700 mb-1">Accuracy Trend (' + activeSec.shortName + ')</div>' +
                graphHTML +
              '</div>' +
              '<div class="p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-100 text-xs text-indigo-950 leading-relaxed">' +
                '<strong class="font-bold">Weakness Analysis:</strong> ' + weaknessAnalysis +
              '</div>' +
            '</div>' +
            '<div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col justify-between space-y-4">' +
              '<div>' +
                '<h4 class="text-sm font-extrabold text-slate-900">Log Book / External Practice</h4>' +
                '<p class="text-xs text-slate-500 mt-0.5">Record scores from telc practice books for ' + activeSec.shortName + ':</p>' +
                '<form id="reading-manual-form" class="mt-3 space-y-3">' +
                  '<input type="hidden" name="secId" value="' + activeSec.id + '" />' +
                  '<div class="grid grid-cols-2 gap-2">' +
                    '<div><label class="text-[11px] font-bold text-slate-600 block mb-1">Correct</label><input type="number" name="correct" min="0" max="100" required placeholder="e.g. 4" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold" /></div>' +
                    '<div><label class="text-[11px] font-bold text-slate-600 block mb-1">Total Qs</label><input type="number" name="total" min="1" max="100" required placeholder="e.g. 5" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold" /></div>' +

    // 10B. Vocabulary Practice Sub-View (13 Themes + Recall Quiz + Status Tracking)
    function renderVocabPracticeSubView() {
      var allWords = [];
      VOCAB_THEMES.forEach(function(t) { allWords = allWords.concat(t.words); });

      var learnedCount = allWords.filter(function(w) { return appState.vocabStatus[w.id] === 'learned'; }).length;
      var rememberedCount = allWords.filter(function(w) { return appState.vocabStatus[w.id] === 'remembered'; }).length;
      var reviseCount = allWords.filter(function(w) { return appState.vocabStatus[w.id] === 'revise'; }).length;

      var activeTheme = VOCAB_THEMES.find(function(t) { return t.id === uiState.selectedVocabThemeId; }) || VOCAB_THEMES[0];
      var themeWords = activeTheme.words;

      if (uiState.vocabQuizMode) {
        var qWord = themeWords[uiState.vocabQuizIndex % themeWords.length];
        var distractors = allWords.filter(function(w) { return w.id !== qWord.id; });
        var d1 = distractors[(uiState.vocabQuizIndex * 3 + 1) % distractors.length];
        var d2 = distractors[(uiState.vocabQuizIndex * 5 + 2) % distractors.length];

        function formatWordLabel(w) {
          var hasArt = w.article !== 'Verb' && w.article !== 'Adj.' && w.article !== 'Adv.' && w.article !== 'soziale';
          return (hasArt ? w.article + ' ' : '') + w.de;
        }

        var rawOpts = [
          { label: formatWordLabel(qWord), correct: true },
          { label: formatWordLabel(d1), correct: false },
          { label: formatWordLabel(d2), correct: false }
        ];
        var shift = uiState.vocabQuizIndex % 3;
        var opts = rawOpts.slice(shift).concat(rawOpts.slice(0, shift));

        var quizOptsHTML = opts.map(function(o, i) {
          var cls = 'bg-white border-slate-200 hover:border-indigo-400 text-slate-800';
          if (uiState.vocabQuizAnswered !== null) {
            if (o.correct) cls = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
            else if (i === uiState.vocabQuizAnswered) cls = 'bg-rose-50 border-rose-400 text-rose-900';
          }
          return '<button data-vocab-quiz-ans="' + i + '|' + (o.correct ? '1' : '0') + '|' + qWord.id + '" class="p-4 rounded-xl border text-sm font-semibold text-left transition ' + cls + '">' + o.label + '</button>';
        }).join('');

        var nextBlock = uiState.vocabQuizAnswered !== null
          ? '<div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-wrap items-center justify-between gap-3">' +
              '<div class="text-xs text-slate-700"><strong>Example:</strong> ' + qWord.ex + ' <span class="text-slate-500">(' + qWord.exEn + ')</span></div>' +
              '<button id="next-vocab-quiz-btn" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Next Word →</button>' +
            '</div>'
          : '';

        return (
          '<div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs space-y-5">' +
            '<div class="flex items-center justify-between">' +
              '<div><span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Recall Quiz • ' + activeTheme.title + '</span><h3 class="text-lg font-extrabold text-slate-900">Word ' + ((uiState.vocabQuizIndex % themeWords.length) + 1) + ' of ' + themeWords.length + '</h3></div>' +
              '<button id="exit-vocab-quiz-btn" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">← Back to Word Cards</button>' +
            '</div>' +

    // 10C. Hören Practice Sub-View
    function renderHoerenPracticeSubView() {

          var qKey = 'hoeren_' + ex.id + '_' + qIdx;

          var optsHTML = qItem.options.map(function(opt, oIdx) {

            if (isAns) {

              else if (oIdx === chosen) cls = 'bg-rose-50 border-rose-400 text-rose-900';
            }
            return '<button data-quiz-pick="' + qKey + '|' + oIdx + '" class="p-2.5 rounded-xl border text-xs text-left transition ' + cls + '">' + opt + '</button>';

          return (

            '</div>'
          );
        }).join('');

        return (
          '<div class="tab-fade space-y-5">' +
            headerToggle +
            '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">' +
              '<div class="p-3.5 rounded-xl bg-white border border-slate-200 text-xs"><div class="font-extrabold text-indigo-700">1. Nebensatz (Verb at End)</div><p class="text-slate-600 mt-1">weil, obwohl, damit, bevor, nachdem, während, falls, dass, wenn → conjugated verb goes to the VERY END.</p></div>' +
              '<div class="p-3.5 rounded-xl bg-white border border-slate-200 text-xs"><div class="font-extrabold text-amber-700">2. Hauptsatz Adverb (Pos 2)</div><p class="text-slate-600 mt-1">trotzdem, deshalb, deswegen, außerdem, daher → conjugated verb immediately follows the connector!</p></div>' +
              '<div class="p-3.5 rounded-xl bg-white border border-slate-200 text-xs"><div class="font-extrabold text-emerald-700">3. um … zu vs. damit</div><p class="text-slate-600 mt-1">Same subject = <strong>um … zu + Infinitiv</strong>. Different subjects = <strong>damit + conjugated verb at end</strong>.</p></div>' +
              '<div class="p-3.5 rounded-xl bg-white border border-slate-200 text-xs"><div class="font-extrabold text-rose-700">4. je … desto / umso</div><p class="text-slate-600 mt-1">Je + Comp + … + Verb (END), desto/umso + Comp + <strong>Verb (Pos 2) + Subject</strong>.</p></div>' +
            '</div>' +
            '<div class="grid grid-cols-1 lg:grid-cols-4 gap-5">' +
              '<div class="bg-white rounded-2xl border border-slate-200 p-3 shadow-xs space-y-1 max-h-[580px] overflow-y-auto">' + connSidebarHTML + '</div>' +
              '<div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs space-y-5">' +
                '<div class="flex flex-wrap items-start justify-between gap-3 border-b border-slate-100 pb-4">' +
                  '<div><span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">' + conn.category + '</span><h3 class="text-2xl font-extrabold text-slate-900 mt-1">' + conn.name + '</h3><p class="text-sm font-medium text-slate-600 mt-0.5">English Meaning: <strong class="text-slate-900">' + conn.meaning + '</strong></p></div>' +

                '</div>' +
                '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">' +
                  '<div class="p-4 rounded-xl bg-slate-50 border border-slate-200/80"><div class="text-xs font-extrabold uppercase text-slate-500 mb-1">Sentence Structure</div><p class="text-xs sm:text-sm font-bold text-slate-900">' + conn.structure + '</p></div>' +
                  '<div class="p-4 rounded-xl bg-amber-50/80 border border-amber-200"><div class="text-xs font-extrabold uppercase text-amber-800 mb-1">Where the Conjugated Verb Goes</div><p class="text-xs sm:text-sm font-bold text-amber-950">' + conn.verbPosition + '</p></div>' +
                '</div>' +
                '<div class="space-y-2"><div class="text-xs font-extrabold uppercase text-slate-500">German Examples with Translations</div><div class="space-y-2">' + connExamplesHTML + '</div></div>' +
                '<div class="p-4 rounded-xl bg-rose-50/70 border border-rose-200 space-y-1.5"><div class="text-xs font-extrabold uppercase text-rose-800">Common Mistakes</div><ul class="space-y-1 text-xs text-rose-950">' + conn.mistakes.map(function(m) { return '<li>• ' + m + '</li>'; }).join('') + '</ul></div>' +
                '<div class="pt-3 border-t border-slate-100 space-y-3"><div class="text-sm font-extrabold text-slate-900">5 Interactive Practice Questions for „' + conn.name + '“</div>' + connExercisesHTML + '</div>' +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }
    }

    // =========================================================================
    // 14. MAIN RENDER & EVENT LISTENERS
    // =========================================================================
    function populateTodayDropdown() {
      var sel = document.getElementById('active-today-select');
      if (!sel) return;
      var curToday = getLocalTodayISO();
      sel.innerHTML = ALL_DATES.map(function(d) {
        return '<option value="' + d + '" ' + (d === curToday ? 'selected' : '') + '>' + formatShortDate(d) + '</option>';
      }).join('');
    }

    function updateNavActiveStyles() {
      document.querySelectorAll('.nav-btn').forEach(function(btn) {
        var active = btn.dataset.nav === uiState.currentView;
        btn.className = active
          ? 'nav-btn px-3 py-2 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-xs transition'
          : 'nav-btn px-3 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition';
      });
      document.querySelectorAll('.mob-nav-btn').forEach(function(btn) {
        var active = btn.dataset.nav === uiState.currentView;
        btn.className = active
          ? 'mob-nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-[10px] font-bold text-indigo-600 bg-indigo-50/80 transition'
          : 'mob-nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-[10px] font-semibold text-slate-500 hover:text-slate-900 transition';
      });
    }

    function renderApp() {
      speechTextMap = {};
      taskLinkMap = {};
      speechSeq = 0;
      updateNavActiveStyles();
      populateTodayDropdown();
      var main = document.getElementById('app-main');
      if (!main) return;

      var tutorBanner = uiState.tutorReadOnlyMode
        ? '<div class="mb-5 p-4 rounded-2xl bg-sky-900 text-white flex flex-wrap items-center justify-between gap-3 shadow-sm">' +
            '<div class="flex items-center gap-2.5">' +
              '<span class="px-2.5 py-1 rounded-lg bg-sky-500/30 border border-sky-400/40 text-xs font-extrabold">TUTOR VIEW (READ-ONLY)</span>' +
              '<span class="text-xs sm:text-sm text-sky-100">Viewing student progress for <strong>' + uiState.tutorShareCode + '</strong></span>' +
            '</div>' +
            '<button id="banner-exit-tutor-btn" class="px-3.5 py-1.5 rounded-xl bg-white text-slate-900 text-xs font-bold hover:bg-sky-50 transition">Exit Tutor View</button>' +
          '</div>'
        : '';

      var viewHTML = '';
      if (uiState.currentView === 'calendar') viewHTML = renderCalendarView();
      else if (uiState.currentView === 'tasks') viewHTML = renderTasksWorkspaceView();
      else if (uiState.currentView === 'practice') viewHTML = renderPracticeView();
      else if (uiState.currentView === 'mocks') viewHTML = renderMockExamsView();
      else if (uiState.currentView === 'progress') viewHTML = renderProgressView();
      else if (uiState.currentView === 'grammar') viewHTML = renderGrammarAndConnectorsView();

      main.innerHTML = tutorBanner + viewHTML;

      var exitBannerBtn = document.getElementById('banner-exit-tutor-btn');
      if (exitBannerBtn) {
        exitBannerBtn.onclick = function() {
          if (cloudUnsubscribe) {
            try { cloudUnsubscribe(); } catch (e) {}
            cloudUnsubscribe = null;
          }
          uiState.tutorReadOnlyMode = false;
          getOrCreateTutorCode();
          loadState();
          renderApp();
        };
      }

      attachDynamicListeners();
    }

    function attachDynamicListeners() {
      document.querySelectorAll('[data-nav]').forEach(function(el) {
        el.onclick = function() {
          uiState.currentView = el.dataset.nav;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          renderApp();
        };
      });

      var jumpTodayCal = document.getElementById('jump-today-cal-btn');
      if (jumpTodayCal) {
        jumpTodayCal.onclick = function() {
          uiState.selectedDate = getLocalTodayISO();
          renderApp();
          setTimeout(function() {
            var target = document.getElementById('selected-day-schedule');
            if (target) target.scrollIntoView({ behavior: 'smooth' });
          }, 50);
        };
      }

      document.querySelectorAll('[data-select-date]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.selectedDate = btn.dataset.selectDate;
          renderApp();
          if (uiState.currentView === 'calendar') {
            setTimeout(function() {
              var target = document.getElementById('selected-day-schedule');
              if (target) target.scrollIntoView({ behavior: 'smooth' });
            }, 50);
          }
        };
      });

      var tasksDateSelect = document.getElementById('tasks-date-select');
      if (tasksDateSelect) {
        tasksDateSelect.onchange = function(e) {
          uiState.selectedDate = e.target.value;
          renderApp();
        };
      }

      // Checkbox toggle (NEVER auto-checked; user click only)
      document.querySelectorAll('[data-toggle-task]').forEach(function(btn) {
        btn.onclick = function() {
          var tid = btn.dataset.toggleTask;
          appState.completedTasks[tid] = !appState.completedTasks[tid];
          if (appState.completedTasks[tid]) {
            showToast('Task completed!');
          }
          saveState();
        };
      });

      // Start/Pause Timer
      document.querySelectorAll('[data-start-timer]').forEach(function(btn) {
        btn.onclick = function() {
          var parts = btn.dataset.startTimer.split('|');
          startTaskTimer(parts[0], parts[1]);
        };
      });

      // Reschedule Unfinished Task
      document.querySelectorAll('[data-reschedule-task]').forEach(function(btn) {
        btn.onclick = function() {
          var parts = btn.dataset.rescheduleTask.split('|');
          openRescheduleModal(parts[0], parts[1]);
        };
      });

      // Open Module Link from Task
      document.querySelectorAll('[data-open-task-link]').forEach(function(btn) {
        btn.onclick = function() {
          var link = taskLinkMap[btn.dataset.openTaskLink];
          if (!link) return;
          uiState.currentView = link.view;
          if (link.view === 'practice' && link.sub) {
            uiState.practiceSubTab = link.sub;
            if (link.sub === 'reading' && link.id) uiState.selectedReadingId = link.id;
            if (link.sub === 'vocab' && link.id) uiState.selectedVocabThemeId = link.id;
            if (link.sub === 'schreiben' && link.id) uiState.selectedSchreibenId = link.id;
            if (link.sub === 'sprechen' && link.id) uiState.selectedSprechenId = link.id;
          } else if (link.view === 'grammar' && link.sub) {
            uiState.grammarSubTab = link.sub;
            if (link.sub === 'grammar' && link.id) uiState.selectedGrammarId = link.id;
            if (link.sub === 'connectors' && link.id) uiState.selectedConnectorId = link.id;
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
          renderApp();
        };
      });

      // Save Daily Notes on Blur
      document.querySelectorAll('[data-day-note]').forEach(function(ta) {
        ta.onblur = function() {
          var d = ta.dataset.dayNote;
          appState.taskNotes[d] = ta.value;
          saveState();
        };
      });

      // Practice Sub-Tabs
      document.querySelectorAll('[data-practice-sub]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.practiceSubTab = btn.dataset.practiceSub;
          renderApp();
        };
      });

      // Reading Section Selector
      document.querySelectorAll('[data-select-reading]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.selectedReadingId = btn.dataset.selectReading;
          renderApp();
        };
      });

      // Manual Reading/SB Score Form
      var readManualForm = document.getElementById('reading-manual-form');
      if (readManualForm) {
        readManualForm.onsubmit = function(e) {
          e.preventDefault();
          var fd = new FormData(readManualForm);
          var secId = fd.get('secId');
          var correct = Number(fd.get('correct'));
          var total = Number(fd.get('total'));
          var note = String(fd.get('note') || '').trim();
          if (correct > total) {
            showToast('Correct answers cannot exceed total questions.');
            return;
          }
          if (!appState.readingLogs[secId]) appState.readingLogs[secId] = [];
          appState.readingLogs[secId].push({
            date: getLocalTodayISO(),
            correct: correct,
            total: total,
            note: note
          });
          showToast('Practice score saved & analytics updated!');
          saveState();
        };
      }

      // Record Interactive Reading Quiz Score
      document.querySelectorAll('[data-record-interactive-reading]').forEach(function(btn) {
        btn.onclick = function() {
          var secId = btn.dataset.recordInteractiveReading;
          var sec = READING_SECTIONS.find(function(s) { return s.id === secId; });
          var qs = sec.practiceSets[0].questions;
          var correct = 0;
          var answeredCount = 0;
          qs.forEach(function(q, idx) {
            var chosen = uiState.quizSelections['read_' + secId + '_' + idx];
            if (chosen !== undefined) {
              answeredCount++;
              if (chosen === q.ans) correct++;
            }
          });
          if (answeredCount === 0) {
            showToast('Answer at least one question above before recording!');
            return;
          }
          if (!appState.readingLogs[secId]) appState.readingLogs[secId] = [];
          appState.readingLogs[secId].push({
            date: getLocalTodayISO(),
            correct: correct,
            total: qs.length,
            note: 'Interactive Drill'
          });
          showToast('Recorded ' + correct + '/' + qs.length + ' for ' + sec.shortName + '!');
          saveState();
        };
      });

      // Generic Interactive Quiz Option Picker
      document.querySelectorAll('[data-quiz-pick]').forEach(function(btn) {
        btn.onclick = function() {
          var parts = btn.dataset.quizPick.split('|');
          uiState.quizSelections[parts[0]] = Number(parts[1]);
          renderApp();
        };
      });

      // Vocab Handlers
      document.querySelectorAll('[data-select-vocab-theme]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.selectedVocabThemeId = btn.dataset.selectVocabTheme;
          uiState.vocabQuizMode = false;
          renderApp();
        };
      });

      document.querySelectorAll('[data-vocab-status]').forEach(function(btn) {
        btn.onclick = function() {
          var parts = btn.dataset.vocabStatus.split('|');
          appState.vocabStatus[parts[0]] = parts[1];
          saveState();
        };
      });

      var startVocabQuizBtn = document.getElementById('start-vocab-quiz-btn');
      if (startVocabQuizBtn) {
        startVocabQuizBtn.onclick = function() {
          uiState.vocabQuizMode = true;
          uiState.vocabQuizIndex = 0;
          uiState.vocabQuizAnswered = null;
          renderApp();
        };
      }

      var exitVocabQuizBtn = document.getElementById('exit-vocab-quiz-btn');
      if (exitVocabQuizBtn) {
        exitVocabQuizBtn.onclick = function() {
          uiState.vocabQuizMode = false;
          renderApp();
        };
      }

      document.querySelectorAll('[data-vocab-quiz-ans]').forEach(function(btn) {
        btn.onclick = function() {
          if (uiState.vocabQuizAnswered !== null) return;
          var parts = btn.dataset.vocabQuizAns.split('|');
          uiState.vocabQuizAnswered = Number(parts[0]);
          appState.vocabStatus[parts[2]] = parts[1] === '1' ? 'remembered' : 'revise';
          saveState();
        };
      });

      var nextVocabQuizBtn = document.getElementById('next-vocab-quiz-btn');
      if (nextVocabQuizBtn) {
        nextVocabQuizBtn.onclick = function() {
          uiState.vocabQuizIndex += 1;
          uiState.vocabQuizAnswered = null;
          renderApp();
        };
      }

      // German TTS & Hören Handlers
      document.querySelectorAll('[data-speak-key]').forEach(function(btn) {
        btn.onclick = function() {
          var txt = speechTextMap[btn.dataset.speakKey];
          if (txt) speakGerman(txt);
        };
      });

      document.querySelectorAll('[data-toggle-transcript]').forEach(function(btn) {
        btn.onclick = function() {
          var id = btn.dataset.toggleTranscript;
          uiState.showTranscript[id] = !uiState.showTranscript[id];
          renderApp();
        };
      });

      var hoerenMistakeForm = document.getElementById('hoeren-mistake-form');
      if (hoerenMistakeForm) {
        hoerenMistakeForm.onsubmit = function(e) {
          e.preventDefault();
          var fd = new FormData(hoerenMistakeForm);
          var text = String(fd.get('mistake') || '').trim();
          if (!text) return;
          if (!appState.hoerenMistakes) appState.hoerenMistakes = [];
          appState.hoerenMistakes.push({ date: getLocalTodayISO(), text: text });
          showToast('Listening note added!');
          saveState();
        };
      }

      // Schreiben Handlers
      document.querySelectorAll('[data-select-schreiben]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.selectedSchreibenId = btn.dataset.selectSchreiben;
          renderApp();
        };
      });

      document.querySelectorAll('[data-toggle-writing-point]').forEach(function(btn) {
        btn.onclick = function() {
          var parts = btn.dataset.toggleWritingPoint.split('|');
          var pId = parts[0], idx = parts[1];
          if (!appState.schreibenDrafts[pId]) appState.schreibenDrafts[pId] = { text: '', feedback: '', mistakes: '', checkedPoints: {} };
          if (!appState.schreibenDrafts[pId].checkedPoints) appState.schreibenDrafts[pId].checkedPoints = {};
          appState.schreibenDrafts[pId].checkedPoints[idx] = !appState.schreibenDrafts[pId].checkedPoints[idx];
          saveState();
        };
      });

      var saveSchreibenBtn = document.getElementById('save-schreiben-btn');
      if (saveSchreibenBtn) {
        saveSchreibenBtn.onclick = function() {
          var pId = saveSchreibenBtn.dataset.schreibenId;
          var textEl = document.getElementById('schreiben-textarea');
          var fbEl = document.getElementById('schreiben-feedback');
          var mkEl = document.getElementById('schreiben-mistakes');
          if (!appState.schreibenDrafts[pId]) appState.schreibenDrafts[pId] = { checkedPoints: {} };
          appState.schreibenDrafts[pId].text = textEl ? textEl.value : '';
          appState.schreibenDrafts[pId].feedback = fbEl ? fbEl.value : '';
          appState.schreibenDrafts[pId].mistakes = mkEl ? mkEl.value : '';
          showToast('Writing draft & self-correction saved!');
          saveState();
        };
      }

      document.querySelectorAll('[data-toggle-model-writing]').forEach(function(btn) {
        btn.onclick = function() {
          var id = btn.dataset.toggleModelWriting;
          uiState.showModelWriting[id] = !uiState.showModelWriting[id];
          renderApp();
        };
      });

      // Sprechen Handlers
      document.querySelectorAll('[data-select-sprechen]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.selectedSprechenId = btn.dataset.selectSprechen;
          renderApp();
        };
      });

      var spTimerToggle = document.getElementById('sp-timer-toggle');
      if (spTimerToggle) {
        spTimerToggle.onclick = function() {
          uiState.speakingTimerRunning = !uiState.speakingTimerRunning;
          renderApp();
        };
      }

      document.querySelectorAll('[data-sp-preset]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.speakingTimerSec = Number(btn.dataset.spPreset);
          uiState.speakingTimerRunning = false;
          renderApp();
        };
      });

      document.querySelectorAll('[data-toggle-sp-conf]').forEach(function(btn) {
        btn.onclick = function() {
          var k = btn.dataset.toggleSpConf;
          appState.sprechenConfidence[k] = !appState.sprechenConfidence[k];
          saveState();
        };
      });

      // Mock Exam Form & Delete
      var mockForm = document.getElementById('mock-exam-form');
      if (mockForm) {
        mockForm.onsubmit = function(e) {
          e.preventDefault();
          var fd = new FormData(mockForm);
          function numOrNull(val) {
            return (val === '' || val === null) ? null : Number(val);
          }

          var l1c = numOrNull(fd.get('l1_c')), l1t = numOrNull(fd.get('l1_t'));
          var l2c = numOrNull(fd.get('l2_c')), l2t = numOrNull(fd.get('l2_t'));
          var l3c = numOrNull(fd.get('l3_c')), l3t = numOrNull(fd.get('l3_t'));
          var sb1c = numOrNull(fd.get('sb1_c')), sb1t = numOrNull(fd.get('sb1_t'));
          var sb2c = numOrNull(fd.get('sb2_c')), sb2t = numOrNull(fd.get('sb2_t'));
          var hs = numOrNull(fd.get('hoeren_s')), hm = numOrNull(fd.get('hoeren_m'));
          var schs = numOrNull(fd.get('schreiben_s')), schm = numOrNull(fd.get('schreiben_m'));
          var sps = numOrNull(fd.get('sprechen_s')), spm = numOrNull(fd.get('sprechen_m'));

          var entry = {
            id: 'mock_' + Date.now(),
            name: String(fd.get('examName') || 'Mock Exam').trim(),
            date: String(fd.get('examDate') || getLocalTodayISO()),
            lesen1: l1t > 0 ? { correct: l1c || 0, total: l1t } : null,
            lesen2: l2t > 0 ? { correct: l2c || 0, total: l2t } : null,
            lesen3: l3t > 0 ? { correct: l3c || 0, total: l3t } : null,
            sb1: sb1t > 0 ? { correct: sb1c || 0, total: sb1t } : null,
            sb2: sb2t > 0 ? { correct: sb2c || 0, total: sb2t } : null,
            hoeren: hm > 0 ? { score: hs || 0, max: hm, parts: String(fd.get('hoeren_parts') || '') } : null,
            schreiben: schm > 0 ? { score: schs || 0, max: schm, feedback: String(fd.get('schreiben_fb') || '') } : null,
            sprechen: spm > 0 ? { score: sps || 0, max: spm, feedback: String(fd.get('sprechen_fb') || '') } : null,
            notes: String(fd.get('notes') || '').trim()
          };

          if (!appState.mockExams) appState.mockExams = [];
          appState.mockExams.push(entry);
          showToast('Mock Exam saved! Adaptive study plan updated.');
          saveState();
        };
      }

      document.querySelectorAll('[data-delete-mock]').forEach(function(btn) {
        btn.onclick = function() {
          var mId = btn.dataset.deleteMock;
          appState.mockExams = (appState.mockExams || []).filter(function(m) { return m.id !== mId; });
          showToast('Mock exam entry removed.');
          saveState();
        };
      });

      // Grammar & Connectors Handlers
      document.querySelectorAll('[data-grammar-sub]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.grammarSubTab = btn.dataset.grammarSub;
          renderApp();
        };
      });

      document.querySelectorAll('[data-select-grammar]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.selectedGrammarId = btn.dataset.selectGrammar;
          renderApp();
        };
      });

      document.querySelectorAll('[data-toggle-grammar-done]').forEach(function(btn) {
        btn.onclick = function() {
          var id = btn.dataset.toggleGrammarDone;
          appState.completedGrammar[id] = !appState.completedGrammar[id];
          saveState();
        };
      });

      document.querySelectorAll('[data-select-connector]').forEach(function(btn) {
        btn.onclick = function() {
          uiState.selectedConnectorId = btn.dataset.selectConnector;
          renderApp();
        };
      });

      document.querySelectorAll('[data-toggle-conn-done]').forEach(function(btn) {
        btn.onclick = function() {
          var id = btn.dataset.toggleConnDone;
          appState.completedConnectors[id] = !appState.completedConnectors[id];
          saveState();
        };
      });
    }

    // Top Header Controls
    document.getElementById('header-tutor-btn').addEventListener('click', function() {
      openTutorPortalModal();
    });

    document.getElementById('header-today-btn').addEventListener('click', function() {
      uiState.selectedDate = getLocalTodayISO();
      uiState.currentView = 'calendar';
      renderApp();
      setTimeout(function() {
        var target = document.getElementById('selected-day-schedule');
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      }, 60);
    });

    document.getElementById('active-today-select').addEventListener('change', function(e) {
      customTodayOverride = e.target.value;
      uiState.selectedDate = customTodayOverride;
      renderApp();
    });

    // Boot Application
    loadState();
    renderApp();
    initCloudSync();
  </script>
</body>
</html>
